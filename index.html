<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Links da Unifesspa</title>
<meta name="description" content="Principais links da Universidade Federal do Sul e Sudeste do Pará.">
<style>
:root{--bg:#F3F0E8;--fg:#16291D;--mut:#4b5d51;--g:#2F6B3F;--gd:#245230;--surface:#fff;--line:#d8d3c6}
@media (prefers-color-scheme:dark){:root{--bg:#10190F;--fg:#EAF1E9;--mut:#a9b8ab;--g:#6fbf84;--gd:#8fd3a2;--surface:#1a271b;--line:#2b3b2d}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:36px 18px 48px}
header{text-align:center;margin-bottom:26px}
.av{width:136px;height:136px;margin:0 auto;border-radius:50%;background:#fefefe;border:1.5px solid var(--g);display:flex;align-items:center;justify-content:center}
.av img{width:96px;height:auto;display:block}
h1{margin:16px 0 6px;font-size:28px;line-height:1.15}
.desc{margin:0 auto;color:var(--mut);max-width:42ch;font-size:16px}
.lista{display:flex;flex-direction:column;gap:12px}
.sec{margin:14px 0 0;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--g)}
a.link{display:flex;align-items:center;justify-content:center;min-height:54px;padding:12px 26px;border:1.5px solid var(--g);border-radius:999px;background:transparent;color:var(--fg);text-decoration:none;font-weight:600;text-align:center;transition:background .15s,color .15s}
a.link:hover{background:var(--g);color:#fff}
a.link:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
a.link.destaque{border-width:2.5px}
footer{margin-top:40px;text-align:center;font-size:12px;color:var(--mut);opacity:.7}
/* modo de edição */
.ed{margin-top:30px;padding:16px;border:2px dashed var(--g);border-radius:14px;background:var(--surface)}
.ed h2{margin:0 0 4px;font-size:19px}
.ed p{margin:0 0 12px;font-size:14px;color:var(--mut)}
.ed .row{display:grid;grid-template-columns:1fr;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.ed input{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg);min-height:42px}
.ed .acoes{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-weight:600;padding:8px 13px;min-height:40px;border-radius:10px;border:1px solid var(--g);background:transparent;color:var(--fg);cursor:pointer}
button.p{background:var(--g);color:#fff}
label.chk{display:flex;gap:6px;align-items:center;font-size:14px}
label.chk input{width:auto;min-height:0}
.msg{margin-top:10px;font-size:14px;color:var(--gd)}
</style>
</head>

    <h1 id="titulo">Unifesspa</h1>
    <p class="desc" id="desc"></p>
  </header>
  <main><nav class="lista" id="lista" aria-label="Links"></nav></main>

  <section class="ed" id="ed" hidden>
    <h2>Modo de edição</h2>
    <p>Altere os links abaixo e clique em "Baixar links.json". Depois envie o arquivo para a pasta "dados" do repositório "links" no GitHub. Só quem tem acesso ao repositório consegue publicar.</p>
    <div class="row"><label for="e_tit">Título da página</label><input id="e_tit"></div>
    <div class="row"><label for="e_desc">Descrição</label><input id="e_desc"></div>
    <div id="e_itens"></div>
    <div class="acoes" style="margin-top:12px">
      <button type="button" id="addLink">Adicionar link</button>
      <button type="button" id="addSec">Adicionar título de seção</button>
      <button type="button" class="p" id="baixar">Baixar links.json</button>
    </div>
    <div class="msg" id="msg" role="status"></div>
  </section>
  <footer>Desenvolvido pela Assessoria de Comunicação</footer>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EDIT=new URLSearchParams(location.search).has('editar');
let D={titulo:'Unifesspa',descricao:'',itens:[]};
function urlOk(u){try{const x=new URL(u);return x.protocol==='https:'||x.protocol==='http:'}catch(e){return false}}
function render(){
  document.title=D.titulo+' | Links';
  $('#titulo').textContent=D.titulo; $('#desc').textContent=D.descricao||''; $('#desc').hidden=!D.descricao;
  $('#lista').innerHTML=D.itens.map(i=>{
    if(i.secao)return `<div class="sec" role="heading" aria-level="2">${esc(i.secao)}</div>`;
    if(!i.titulo||!urlOk(i.url))return '';
    return `<a class="link${i.destaque?' destaque':''}" href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.titulo)}</a>`;
  }).join('');
}
function renderEd(){
  $('#e_tit').value=D.titulo; $('#e_desc').value=D.descricao||'';
  $('#e_itens').innerHTML=D.itens.map((i,n)=>`<div class="row" data-n="${n}">
    ${i.secao!==undefined?`<label>Título de seção<input data-k="secao" value="${esc(i.secao)}"></label>`
    :`<label>Texto do botão<input data-k="titulo" value="${esc(i.titulo)}"></label><label>Endereço (https://...)<input data-k="url" value="${esc(i.url)}"></label>
      <label class="chk"><input type="checkbox" data-k="destaque" ${i.destaque?'checked':''}> Destacar (contorno mais grosso)</label>`}
    <div class="acoes"><button type="button" data-a="up" aria-label="Subir">Subir</button><button type="button" data-a="down" aria-label="Descer">Descer</button><button type="button" data-a="del">Remover</button></div></div>`).join('');
}
function sync(){render();try{localStorage.setItem('links_rascunho',JSON.stringify(D))}catch(e){}}
async function init(){
  try{const r=await fetch('dados/links.json',{cache:'no-store'});if(r.ok)D=await r.json()}catch(e){}
  if(EDIT){
    try{const x=JSON.parse(localStorage.getItem('links_rascunho')||'null');if(x&&x.itens)D=x}catch(e){}
    $('#ed').hidden=false; renderEd();
    $('#e_tit').oninput=e=>{D.titulo=e.target.value;sync()};
    $('#e_desc').oninput=e=>{D.descricao=e.target.value;sync()};
    $('#e_itens').addEventListener('input',e=>{const row=e.target.closest('.row');const n=+row.dataset.n,k=e.target.dataset.k;D.itens[n][k]=e.target.type==='checkbox'?e.target.checked:e.target.value;sync()});
    $('#e_itens').addEventListener('click',e=>{const a=e.target.dataset.a;if(!a)return;const n=+e.target.closest('.row').dataset.n;
      if(a==='del')D.itens.splice(n,1);
      if(a==='up'&&n>0)[D.itens[n-1],D.itens[n]]=[D.itens[n],D.itens[n-1]];
      if(a==='down'&&n<D.itens.length-1)[D.itens[n+1],D.itens[n]]=[D.itens[n],D.itens[n+1]];
      sync();renderEd()});
    $('#addLink').onclick=()=>{D.itens.push({titulo:'',url:'https://'});sync();renderEd()};
    $('#addSec').onclick=()=>{D.itens.push({secao:''});sync();renderEd()};
    $('#baixar').onclick=()=>{
      const ruins=D.itens.filter(i=>!i.secao&&i.secao!==''&&(!i.titulo||!urlOk(i.url)));
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:'application/json'}));a.download='links.json';document.body.appendChild(a);a.click();a.remove();
      $('#msg').textContent=ruins.length?`Arquivo baixado. Atenção: ${ruins.length} link(s) sem texto ou com endereço inválido não aparecem na página.`:'Arquivo baixado. Envie para a pasta "dados" do repositório.';
    };
  }
  render();
}
init();
</script>
</body>
